apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sidepilot-server-runtime
  labels:
    app.kubernetes.io/name: sidepilot-server
    app.kubernetes.io/part-of: sidepilot
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: knowledge-system-runtime
  labels:
    app.kubernetes.io/name: knowledge-system
    app.kubernetes.io/part-of: sidepilot
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
