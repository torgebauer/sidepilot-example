openapi: 3.0.1
info:
    title: Market Processes Service
    description: This is a backend service for integration with the market processes.
    contact:
        name: "Salzburg AG für Energie, Verkehr und Telekommunikation"
        url: https://github.com/salzburg-ag
        email: kundenservice@salzburg-ag.at
    version: 1.0.0
tags:
    - name: GetAndRefreshProcesses
    - name: EnergyDataProcesses
    - name: MeteringPointManagement
    - name: EnergyCommunityManagement
    - name: Onboarding
paths:
    /api/communities/{communityId}/processes:
        get:
            summary: Get all market processes for an energy community
            operationId: getMarketProcesses
            tags:
                - GetAndRefreshProcesses
            parameters:
                - name: communityId
                  in: path
                  required: true
                  schema:
                      $ref: "#/components/schemas/CommunityId"
            responses:
                "200":
                    description: Market processes for an energy community
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/MarketProcessStatusResponse"
                "400":
                    description: Invalid request
                "403":
                    description: User is not in ACTIVE status
                "401":
                    description: User is not authenticated
    /api/communities/{communityId}/processes/{marketProcessId}:
        get:
            summary: Get a market process for an energy community
            operationId: getMarketProcess
            tags:
                - GetAndRefreshProcesses
            parameters:
                - name: communityId
                  in: path
                  required: true
                  schema:
                      $ref: "#/components/schemas/CommunityId"
                - name: marketProcessId
                  in: path
                  required: true
                  schema:
                      $ref: "#/components/schemas/MarketProcessId"
            responses:
                "200":
                    description: Market processes for an energy community
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/MarketProcessStatus"
                "404":
                    description: Market process not (yet) found
                "403":
                    description: User is not in ACTIVE status
                "401":
                    description: User is not authenticated
    /api/communities/{communityId}/processes/{marketProcessId}/dismiss:
        post:
            summary: Dismiss the error result of the market-process
            operationId: dismissMarketProcesses
            tags:
                - GetAndRefreshProcesses
            parameters:
                - name: communityId
                  in: path
                  required: true
                  schema:
                      $ref: "#/components/schemas/CommunityId"
                - name: marketProcessId
                  in: path
                  required: true
                  schema:
                      $ref: "#/components/schemas/MarketProcessId"
            responses:
                "200":
                    description: Market Process Result was dismissed
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/MarketProcessStatus"
                "205":
                    description: Market Process Result was already dismissed before
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/MarketProcessStatus"
                "400":
                    description: Invalid request
                "404":
                    description: No market process id or energy community found
                "401":
                    description: User is not authenticated
    /api/communities/{communityId}/processes/{marketProcessId}/refresh:
        post:
            summary: Trigger the refresh of a market process for an energy community
            operationId: refreshMarketProcesses
            tags:
                - GetAndRefreshProcesses
            parameters:
                - name: communityId
                  in: path
                  required: true
                  schema:
                      $ref: "#/components/schemas/CommunityId"
                - name: marketProcessId
                  in: path
                  required: true
                  schema:
                      $ref: "#/components/schemas/MarketProcessId"
            responses:
                "201":
                    description: Refresh of the market process being triggered
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/MarketProcessTrigger"
                "400":
                    description: Invalid request
                "404":
                    description: No market process id or energy community found
                "401":
                    description: User is not authenticated
    /api/communities/{communityId}/energy:
        post:
            summary: Trigger requests for energy data for an energy community
            operationId: requestEnergyDataForEnergyCommunity
            tags:
                - EnergyDataProcesses
            parameters:
                - name: communityId
                  in: path
                  required: true
                  schema:
                      $ref: "#/components/schemas/CommunityId"
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/EnergyDataRequestBody"
            responses:
                "201":
                    description: requested market process id
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/CommunityEnergyDataResponse"
                "400":
                    description: Invalid request
                "403":
                    description: User is not in ACTIVE status
                "401":
                    description: User is not authenticated
    /api/communities/{communityId}/energy-request/eligibility:
        get:
            summary: Check eligibility to create a new energy request
            description: Checks if a new energy data request process can be initiated.
            operationId: checkIfEligibleToRequestEnergyData
            tags:
                - EnergyDataProcesses
            parameters:
                - name: communityId
                  in: path
                  required: true
                  schema:
                      $ref: "#/components/schemas/CommunityId"
            responses:
                "200":
                    description: Eligibility check performed successfully
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/EnergyRequestEligibility"
                "400":
                    description: Invalid community ID format
                "401":
                    description: User is not authenticated
                "403":
                    description: User does not have permission to view this community
    /api/communities/{communityId}/{meteringPointId}/energy:
        post:
            summary: Trigger request for energy data for one metering point
            operationId: requestEnergyDataForMeteringPoint
            tags:
                - EnergyDataProcesses
            parameters:
                - name: communityId
                  in: path
                  required: true
                  schema:
                      $ref: "#/components/schemas/CommunityId"
                - name: meteringPointId
                  in: path
                  required: true
                  schema:
                      $ref: "#/components/schemas/MeteringPointId"
            requestBody:
                description: ""
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/EnergyDataRequestBody"
            responses:
                "201":
                    description: Requested metering points
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/MarketProcessTriggers"
                "400":
                    description: Invalid request
                "403":
                    description: User is not in ACTIVE status
                "401":
                    description: User is not authenticated
    /api/communities/{communityId}/metering-point-number/{meteringPointNumber}/energy:
        post:
            summary: Trigger request for energy data for one metering point by metering point number
            operationId: requestEnergyDataForMeteringPointNumber
            tags:
                - EnergyDataProcesses
            parameters:
                - name: communityId
                  in: path
                  required: true
                  schema:
                      $ref: "#/components/schemas/CommunityId"
                - name: meteringPointNumber
                  in: path
                  required: true
                  schema:
                      $ref: "#/components/schemas/MeteringPointNumber"
            requestBody:
                description: ""
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/EnergyDataRequestBody"
            responses:
                "201":
                    description: Requested metering points
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/MarketProcessTriggers"
                "400":
                    description: Invalid request
                "403":
                    description: User is not in ACTIVE status
                "401":
                    description: User is not authenticated
    /api/m2m/communities/{communityId}/{meteringPointId}/energy:
        post:
            summary: Trigger request for energy data for one metering point
            operationId: requestEnergyDataForMeteringPointM2M
            tags:
                - EnergyDataProcessesM2m
            parameters:
                - name: communityId
                  in: path
                  required: true
                  schema:
                      $ref: "#/components/schemas/CommunityId"
                - name: meteringPointId
                  in: path
                  required: true
                  schema:
                      $ref: "#/components/schemas/MeteringPointId"
            requestBody:
                description: ""
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/EnergyDataRequestBody"
            responses:
                "201":
                    description: Requested metering points
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/MarketProcessTriggers"
                "400":
                    description: Invalid request
                "401":
                    description: Unauthorized - Invalid or missing API key
    /api/m2m/communities/{communityId}/metering-point-number/{meteringPointNumber}/energy:
        post:
            summary: Trigger request for energy data for one metering point by metering point number
            operationId: requestEnergyDataForMeteringPointNumberM2M
            tags:
                - EnergyDataProcessesM2m
            parameters:
                - name: communityId
                  in: path
                  required: true
                  schema:
                      $ref: "#/components/schemas/CommunityId"
                - name: meteringPointNumber
                  in: path
                  required: true
                  schema:
                      $ref: "#/components/schemas/MeteringPointNumber"
            requestBody:
                description: ""
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/EnergyDataRequestBody"
            responses:
                "201":
                    description: Requested metering points
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/MarketProcessTriggers"
                "400":
                    description: Invalid request
                "401":
                    description: Unauthorized - Invalid or missing API key
                "409":
                    description: An active energy data request already exists for this period
    /api/communities/{communityId}/{meteringPointId}:
        post:
            summary: Trigger request to register new metering point
            operationId: registerNewMeteringPoint
            tags:
                - MeteringPointManagement
            parameters:
                - name: communityId
                  in: path
                  required: true
                  schema:
                      $ref: "#/components/schemas/CommunityId"
                - name: meteringPointId
                  in: path
                  required: true
                  schema:
                      $ref: "#/components/schemas/MeteringPointId"
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/RegisterMeteringPointRequestBody"
            responses:
                "201":
                    description: The requested market process id
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/MarketProcessTrigger"
                "400":
                    description: Invalid request
                "403":
                    description: User is not authorised
                "401":
                    description: User is not authenticated
    /api/communities/{communityId}/metering-points:
        get:
            summary: Get all metering points for an energy community
            operationId: getMeteringPoints
            tags:
                - EnergyCommunityManagement
            parameters:
                - name: communityId
                  in: path
                  required: true
                  schema:
                      $ref: "#/components/schemas/CommunityId"
            responses:
                "200":
                    description: Metering points for an energy community
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/GetMeteringPointsResponse"
                "400":
                    description: Invalid request
                "403":
                    description: Not authorised
                "404":
                    description: No energy community found
                "401":
                    description: User is not authenticated
    /api/communities/{communityId}/unassigned-metering-points:
        get:
            summary: Get unassigned metering points for an energy community
            operationId: getUnassignedMeteringPoints
            tags:
                - EnergyCommunityManagement
            parameters:
                - name: communityId
                  in: path
                  required: true
                  schema:
                      $ref: "#/components/schemas/CommunityId"
            responses:
                "200":
                    description: Unassigned Metering points for an energy community
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/UnassignedMeteringPoint"
                "400":
                    description: Invalid request
                "403":
                    description: Not authorised
                "404":
                    description: No energy community found
                "401":
                    description: User is not authenticated
    /api/communities/{communityId}/assigned-metering-points:
        get:
            summary: Get Assigned metering points for an energy community
            operationId: getAssignedMeteringPoints
            tags:
                - EnergyCommunityManagement
            parameters:
                - name: communityId
                  in: path
                  required: true
                  schema:
                      $ref: "#/components/schemas/CommunityId"
            responses:
                "200":
                    description: Assigned Metering points for an energy community
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/AssignedMeteringPoint"
                "400":
                    description: Invalid request
                "403":
                    description: Not authorised
                "404":
                    description: No energy community found
                "401":
                    description: User is not authenticated
    /api/communities/{communityId}/assigned-unassigned-metering-points:
        get:
            summary: Get Assigned & Unassigned metering points for an energy community
            operationId: getAssignedAndUnassignedMeteringPoints
            tags:
                - EnergyCommunityManagement
            parameters:
                - name: communityId
                  in: path
                  required: true
                  schema:
                      $ref: "#/components/schemas/CommunityId"
            responses:
                "200":
                    description: Assigned and Unassinged Metering points for an energy community
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/MeteringPointAssignmentsResponse"
                "400":
                    description: Invalid request
                "403":
                    description: Not authorised
                "404":
                    description: No energy community found
                "401":
                    description: User is not authenticated
    /api/communities/{communityId}/metering-points/{meteringPointId}:
        get:
            summary: Get specific metering point for an energy community
            operationId: getMeteringPoint
            tags:
                - EnergyCommunityManagement
            parameters:
                - name: communityId
                  in: path
                  required: true
                  schema:
                      $ref: "#/components/schemas/CommunityId"
                - name: meteringPointId
                  in: path
                  required: true
                  schema:
                      $ref: "#/components/schemas/MeteringPointId"
            responses:
                "200":
                    description: Metering point for an energy community
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/MeteringPoint"
                "400":
                    description: Invalid request
                "401":
                    description: User is not authenticated
                "403":
                    description: Not authorised
                "404":
                    description: No metering point or energy community found
    /api/communities/{communityId}/participants/{participantId}/metering-points:
        get:
            summary: Get all metering points for a participant in an energy community
            operationId: getParticipantMeteringPoints
            tags:
                - EnergyCommunityManagement
            parameters:
                - name: communityId
                  in: path
                  required: true
                  schema:
                      $ref: "#/components/schemas/CommunityId"
                - name: participantId
                  in: path
                  required: true
                  schema:
                      $ref: "#/components/schemas/ParticipantId"
            responses:
                "200":
                    description: Metering points for a participant in an energy community
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/GetMeteringPointsResponse"
                "400":
                    description: Invalid request
                "403":
                    description: Not authorised
                "404":
                    description: No energy community or participant found
                "401":
                    description: User is not authenticated
    /api/communities/{communityId}/metering-points/activation-periods:
        get:
            summary: Get metering point activation periods for an energy community
            operationId: getMeteringPointsActivationPeriods
            tags:
                - MeteringPointActivationPeriod
            parameters:
                - name: communityId
                  in: path
                  required: true
                  schema:
                      $ref: "#/components/schemas/CommunityId"
            responses:
                "200":
                    description: Metering point activation periods for an energy community
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/MeteringPointActivationsResponse"
                "400":
                    description: Invalid request
                "403":
                    description: Not authorised
                "404":
                    description: No energy community found
                "401":
                    description: User is not authenticated
    /api/communities/{communityId}/metering-point-assignments/activation-periods:
        get:
            summary: Get assigned and unassigned metering point assignment activation periods for an energy community
            operationId: getMeteringPointAssignmentActivationPeriods
            tags:
                - MeteringPointActivationPeriod
            parameters:
                - name: communityId
                  in: path
                  required: true
                  schema:
                      $ref: "#/components/schemas/CommunityId"
            responses:
                "200":
                    description: Assigned and Unassigned Metering point activation periods for an energy community
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/MeteringPointAssignmentActivationsResponse"
                "400":
                    description: Invalid request
                "403":
                    description: Not authorised
                "404":
                    description: No energy community found
                "401":
                    description: User is not authenticated
    /api/communities/{communityId}/metering-point-assignment/activation-periods:
        get:
            summary: Get assigned and unassigned metering point assignment activation periods for a metering point
            operationId: getMeteringPointAssignmentActivationPeriod
            tags:
                - MeteringPointActivationPeriod
            parameters:
                - name: communityId
                  in: path
                  required: true
                  schema:
                      $ref: "#/components/schemas/CommunityId"
                - name: meteringPointNumber
                  in: query
                  required: true
                  schema:
                      $ref: "#/components/schemas/MeteringPointNumber"
            responses:
                "200":
                    description: Assigned and Unassigned Metering point activation periods for an energy community
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/MeteringPointActivationResponse"
                "400":
                    description: Invalid request
                "403":
                    description: Not authorised
                "404":
                    description: No energy community found
                "401":
                    description: User is not authenticated
    /api/communities/{communityId}/configuration:
        post:
            summary: Request podlist
            operationId: requestPodList
            tags:
                - EnergyCommunityManagement
            parameters:
                - name: communityId
                  in: path
                  required: true
                  schema:
                      $ref: "#/components/schemas/CommunityId"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ConfigurationRequestBody"
            responses:
                "201":
                    description: podlist requested
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/MarketProcessTriggers"
                "400":
                    description: Invalid request
                "404":
                    description: No market process id or energy community found
                "401":
                    description: User is not authenticated
    /api/communities/{communityId}/metering-points/participation-factor:
        post:
            summary: Trigger the update of the participation factor for selected metering points of an energy community
            operationId: changeParticipationFactorMeteringPoints
            tags:
                - EnergyCommunityManagement
            parameters:
                - name: communityId
                  in: path
                  required: true
                  schema:
                      $ref: "#/components/schemas/CommunityId"
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ParticipationFactorRequestBody"
            responses:
                "201":
                    description: Metering points participation factor updated
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/MeteringPointsProcessResponse"
                "400":
                    description: Invalid request
                "401":
                    description: User is not authenticated
                "403":
                    description: Not authorised
                "404":
                    description: No energy community found
    /api/communities/{communityId}/metering-points/share-factor:
        post:
            summary: Trigger the update of the share factor for selected metering points of an energy community
            operationId: updateShareFactorMeteringPoints
            tags:
                - EnergyCommunityManagement
            parameters:
                - name: communityId
                  in: path
                  required: true
                  schema:
                      $ref: "#/components/schemas/CommunityId"
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ShareFactorRequestBody"
            responses:
                "201":
                    description: Metering points share factor updated
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/MeteringPointsProcessResponse"
                "400":
                    description: Invalid request
                "401":
                    description: User is not authenticated
                "403":
                    description: Not authorised
                "404":
                    description: No energy community found
    /api/communities/{communityId}/metering-points/register:
        post:
            summary: Register selected metering points of an energy community
            operationId: RegisterMeteringPoints
            tags:
                - EnergyCommunityManagement
            parameters:
                - name: communityId
                  in: path
                  required: true
                  schema:
                      $ref: "#/components/schemas/CommunityId"
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/RegisterMeteringPointsBody"
            responses:
                "201":
                    description: Metering points Registered
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/MarketProcessTriggers"
                "400":
                    description: Invalid request
                "401":
                    description: User is not authenticated
                "403":
                    description: Not authorised
                "404":
                    description: No market process id or energy community found
    /api/communities/{communityId}/metering-points/deactivate:
        post:
            summary: Deactivate selected metering points of an energy community
            operationId: deactivateMeteringPoints
            tags:
                - EnergyCommunityManagement
            parameters:
                - name: communityId
                  in: path
                  required: true
                  schema:
                      $ref: "#/components/schemas/CommunityId"
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/DeactivateMeteringPointsBody"
            responses:
                "201":
                    description: Metering points deactivated
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/MeteringPointsProcessResponse"
                "400":
                    description: Invalid request
                "401":
                    description: User is not authenticated
                "403":
                    description: Not authorised
                "404":
                    description: No market process id or energy community found
    /api/communities/{communityId}/{meteringPointId}/deactivate:
        post:
            summary: Deactivate metering point
            operationId: deactivateMeteringPoint
            tags:
                - MeteringPointManagement
            parameters:
                - name: communityId
                  in: path
                  required: true
                  schema:
                      $ref: "#/components/schemas/CommunityId"
                - name: meteringPointId
                  in: path
                  required: true
                  schema:
                      $ref: "#/components/schemas/MeteringPointId"
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/DeactivateMeteringPointRequestBody"
            responses:
                "201":
                    description: Metering points deactivated
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/MarketProcessTrigger"
                "400":
                    description: Invalid request
                "404":
                    description: No market process id or energy community found
                "401":
                    description: User is not authenticated
    /api/communities/{communityId}/activation:
        get:
            summary: Get community onboarding activation state
            description: Returns the locally cached community activation/onboarding state synced from the EDA onboarding API. Returns 404 if the community has not yet been synced.
            operationId: getCommunityActivation
            tags:
                - Onboarding
            parameters:
                - name: communityId
                  in: path
                  required: true
                  schema:
                      $ref: "#/components/schemas/CommunityId"
            responses:
                "200":
                    description: Community activation record
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/CommunityActivation"
                "401":
                    description: User is not authenticated
                "403":
                    description: Not authorised
                "404":
                    description: No activation record for this community
    /api/onboarding:
        post:
            summary: Start a new partner onboarding
            operationId: startOnboarding
            tags:
                - Onboarding
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/StartOnboardingRequest"
            responses:
                "200":
                    description: Onboarding process started successfully
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/OnboardingStatus"
                "400":
                    description: Invalid request
                "401":
                    description: User is not authenticated
                "403":
                    description: Not authorised
                "409":
                    description: Onboarding already in progress or completed
    /api/onboarding/{backendId}/status:
        get:
            summary: Get onboarding status
            operationId: getOnboardingStatus
            tags:
                - Onboarding
            parameters:
                - name: backendId
                  in: path
                  required: true
                  schema:
                      type: string
            responses:
                "200":
                    description: Onboarding status
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/OnboardingStatus"
                "401":
                    description: User is not authenticated
                "403":
                    description: Not authorised
                "404":
                    description: Onboarding not found
components:
    schemas:
        CommunityId:
            type: string
            format: uuid
        ParticipantId:
            type: string
            format: uuid
        MeteringPointStatus:
            type: string
            enum:
                - ACTIVE
                - NOT_ACTIVE
                - REQUESTED
                - ACCEPTED
                - REJECTED
                - ARCHIVED
                - SCHEDULED
        MarketProcessStatus:
            required:
                - id
                - responses
                - lastUpdateOn
                - marketProcessType
                - messageIds
                - startedOn
                - requestParameters
            type: object
            properties:
                id:
                    $ref: "#/components/schemas/MarketProcessId"
                startedOn:
                    type: string
                    format: date-time
