ops_skills:
  match_threshold: 0.7

guard_vocabulary:
  sentence_split:
    abbreviations: [bzw, vs, max]
  fabricated_action:
    hedged_sentence_pattern: '\?|\b(?:nicht|kein|keine|keinen|keiner|konnte|konnten|könnte|koennte|kann|kannst|leider|fehler|fehlgeschlagen|abgelehnt|würde|wuerde|werde|wird|werden|soll|sollte|möchte|moechte|müsste|muesste|falls|sobald|wenn|bereits|schon|damals|zuvor|bisher|ursprünglich|urspruenglich|vorhin|zuletzt|gestern|letzten?|noch|bedeutet|heißt|heisst)\b|\b(?:not|no|cannot|can''t|couldn''t|could|failed|error|unable|will|would|shall|should|already|previously)\b|\b(?:du hast|hast du|you have|you''ve)\b|\b\d{1,2}\.\d{1,2}\.(?:\d{2,4})?\b|\b(?:19|20)\d{2}\b'
    write_claim_patterns:
      - '(?<![A-Za-zÄÖÜäöüß])(?:ich habe|habe ich|ich hab|hab ich)(?![A-Za-zÄÖÜäöüß])[^.!?\n]{0,120}(?<![A-Za-zÄÖÜäöüß])(?:aktiviert|deaktiviert|geändert|geaendert|aktualisiert|angepasst|eingetragen|gelöscht|geloescht|entfernt|angelegt|erstellt|gespeichert|gesetzt|hinzugefügt|hinzugefuegt|übermittelt|uebermittelt|übertragen|uebertragen|übergeben|uebergeben|gestartet|angestoßen|angestossen|ausgelöst|ausgeloest|veranlasst|beauftragt|storniert|durchgeführt|durchgefuehrt)(?![A-Za-zÄÖÜäöüß])'
      - '(?<![A-Za-zÄÖÜäöüß])(?:wurde|wurden|ist|sind)(?![A-Za-zÄÖÜäöüß])[^.!?\n]{0,80}(?<![A-Za-zÄÖÜäöüß])(?:durchgeführt|durchgefuehrt|übergeben|uebergeben|übermittelt|uebermittelt|angestoßen|angestossen|ausgelöst|ausgeloest|veranlasst|gestartet|storniert|erledigt)(?![A-Za-zÄÖÜäöüß])'
