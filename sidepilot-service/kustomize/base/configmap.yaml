  KNOWLEDGE_API_PORT: "3005"
  KNOWLEDGE_WORKSPACES: pilot
  KNOWLEDGE_WORKSPACE_ID: pilot
  KNOWLEDGE_RETRIEVAL_PROFILE: fast_source
