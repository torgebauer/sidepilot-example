    MeteringPointNumberUniqueProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required:
            - code
            - conflictingNumber
            - participantId
            - participantName
            - conflictType
            - currentFromDate
            - requestedFromDate
          properties:
            code:
              type: string
              enum: [ METERING_POINT_NUMBER_CONFLICT ]
              description: Machine-readable error code.
            conflictingNumber:
              type: string
              description: The metering point number that caused the conflict.
            participantId:
              type: string
              format: uuid
              description: ID of the participant that currently owns the conflicting assignment.
            participantName:
              type: string
              description: Display name of that participant.
            conflictType:
              type: string
              enum: [ OVERLAPPING_TIME_RANGE ]
              description: Type of conflict.
            currentFromDate:
              type: string
              format: date
              description: Start of the current assignment period.
            currentToDate:
              description: Inclusive end of the current assignment period; omitted/null/∞ means open-ended.
              nullable: true
              oneOf:
                - type: string
                  format: date
                - type: string
                  enum: ["∞"]
            requestedFromDate:
              type: string
              format: date
              description: Start of the requested assignment period.
            requestedToDate:
              description: Inclusive end of the requested assignment period; omitted/null/∞ means open-ended.
              nullable: true
              oneOf:
                - type: string
                  format: date
                - type: string
                  enum: ["∞"]
