openapi: 3.0.1
info:
  title: Community Management Service
  description: This is the backend server for the management of energy communities.
  contact:
    name: "Salzburg AG für Energie, Verkehr und Telekommunikation"
    url: https://github.com/salzburg-ag
    email: kundenservice@salzburg-ag.at
  version: 1.0.0
paths:
  /api/community-management/available-grid-operators:
    get:
      tags:
        - GRID_OPERATOR
      summary: Get list of available grid operators
      operationId: getAvailableGridOperators
      responses:
        "200":
          description: getAvailableGridOperators 200 response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GridOperatorResponse'
  /api/community-management/grid-operators:
    get:
      tags:
        - ECMS_COMMUNITY
      summary: Gets a list of all grid operators
      operationId: getGridOperatorsECMS
      responses:
        '200':
          description: response with all grid operators list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GridOperatorResponse'
        "403":
          description: Insufficient privileges
  /api/community-management/grid-operators/{gridOperatorId}:
    put:
      tags:
        - ECMS_COMMUNITY
      summary: update editable fields of a grid operator
      operationId: updateGridOperator
      parameters:
        - name: gridOperatorId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GridOperatorRequest'
        required: true
      responses:
        '200':
          description: response with updated grid operator information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridOperatorResponse'
        "403":
          description: Insufficient privileges
  /api/community-management/communities:
    get:
      tags:
        - ECMS_COMMUNITY
      summary: Gets a pageable list of all the communities
      operationId: getCommunitiesECMS
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            format: int32
            nullable: true
        - name: pageSize
          in: query
          schema:
            type: integer
            format: int32
            nullable: true
      responses:
        "200":
          description: Response with the list of all the communities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunitySearchResponse'
        "403":
          description: Insufficient privileges
    post:
      tags:
        - ECMS_COMMUNITY
      summary: Creates a community
      operationId: createCommunityECMS

      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommunityRequest'
        required: true
      responses:
        "200":
          description: Response with the created community
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityResponse'
        "403":
          description: Insufficient privileges
  /api/community-management/communities/{communityId}:
    get:
      summary: Gets a community by id
      operationId: getCommunity
      tags:
        - COMMUNITY
      parameters:
        - name: communityId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Community data, or null if community not found"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityResponse'
        "403":
          description: Insufficient privileges
    put:
      tags:
        - ECMS_COMMUNITY
      summary: Updates a community
      operationId: updateCommunityECMS
      parameters:
        - name: communityId
          in: path
          required: true
          schema:
            type: string

      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommunityRequest'
        required: true
      responses:
        "200":
          description: Response with the updated community
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityResponse'
        "403":
          description: Insufficient privileges
  /api/community-management/communities/{communityId}/base-information:
    put:
      tags:
        - COMMUNITY
      summary: Updates community base information
      operationId: updateCommunityBaseInformation
      parameters:
        - name: communityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommunityBaseInformationRequest'
        required: true
      responses:
        "200":
          description: Response with the updated community
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityResponse'
        "403":
          description: Insufficient privileges
        "404":
          description: Community not found
  /api/community-management/communities/{communityId}/visibility:
    put:
      tags:
        - COMMUNITY
      summary: Updates community visibility information
      operationId: updateCommunityVisibilityInformation
      parameters:
        - name: communityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommunityVisibilityRequest'
        required: true
      responses:
        "200":
          description: Response with the updated community
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityResponse'
        "403":
          description: Insufficient privileges
        "404":
          description: Community not found
  /api/community-management/communities/{communityId}/notification-settings:
    put:
      tags:
        - COMMUNITY
      summary: Updates community notification settings
      operationId: updateCommunityNotificationSettings
      parameters:
        - name: communityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommunityNotificationSettingsRequest'
        required: true
      responses:
        "200":
          description: Response with the updated community
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityResponse'
        "403":
          description: Insufficient privileges
        "404":
          description: Community not found
  /api/community-management/communities/{communityId}/tariffs:
    put:
      tags:
        - COMMUNITY
      summary: Updates community tariffs
      operationId: updateCommunityTariffs
      parameters:
        - name: communityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommunityTariffRequest'
      responses:
        "200":
          description: Community tariffs updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityTariffResponse'
        "400":
          description: Invalid input
        "403":
          description: Insufficient privileges
        "404":
          description: Community not found
  /api/community-management/communities/{communityId}/membership-fee:
    put:
      tags:
        - COMMUNITY
      summary: Update community membership fee
      operationId: updateCommunityMembershipFee
      parameters:
        - name: communityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommunityMembershipFeeRequest'
      responses:
        "200":
          description: Community membership fee updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityMembershipFeeResponse'
        "400":
          description: Request validation error
        "403":
          description: Insufficient privileges
        "404":
          description: Community not found
  /api/community-management/communities/{communityId}/spreadsheet:
    get:
      tags:
        - ECMS_COMMUNITY
      summary: Gets or creates an Excel report for the community
      operationId: getCommunityReportECMS
      parameters:
        - name: communityId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Response with the report for the community
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
                description: Excel report file
          headers:
            Content-Disposition:
              schema:
                type: string
                example: 'attachment; filename="community_management_{communityId}.xlsx"'
        "404":
          description: No report found or generated
        "403":
          description: Insufficient privileges
  /api/community-management/communities/{communityId}/logo:
    put:
      tags:
        - COMMUNITY_LOGO
      summary: Upload or update a community logo
      description: >
        Uploads a JPG/JPEG/PNG/WebP image as the community logo. The image ratio must between 3:4 to 4:3 (inclusive), min 100px on longest edge.
      operationId: uploadCommunityLogo
      parameters:
        - name: communityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Logo uploaded successfully
        "400":
          description: >
            Invalid image: not a PNG, not square, or dimensions outside the
            allowed 150x150 to 500x500 range.
        "404":
          description: Community not found
    get:
      tags:
        - COMMUNITY_LOGO
      summary: Get the community logo
      operationId: getCommunityLogo
      parameters:
        - name: communityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The community logo
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          description: Community or logo not found
    delete:
      tags:
        - COMMUNITY_LOGO
      summary: Delete the community logo
      operationId: deleteCommunityLogo
      parameters:
        - name: communityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Logo deleted successfully
        "404":
          description: Community not found
  /api/community-management/communities/{communityId}/invite-link:
    get:
      tags:
        - COMMUNITY_INVITE_LINK
      summary: Get current invite link state
      operationId: getCommunityInviteLink
      parameters:
        - name: communityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current invite link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteLinkResponse"
        "403":
          description: Insufficient privileges
        "404":
          description: Community not found
    post:
      tags:
        - COMMUNITY_INVITE_LINK
      summary: Generate an invite link
      description: >
        Creates a new invite link for the community. Rejected if an active
        invite link already exists. The community must have isOpenToJoin enabled.
      operationId: generateCommunityInviteLink
      parameters:
        - name: communityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Invite link generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteLinkResponse"
        "403":
          description: Insufficient privileges
        "404":
          description: Community not found
        "409":
          description: Active invite link already exists
        "422":
          description: Join requests are not enabled
  /api/community-management/communities/{communityId}/invite-link/regenerate:
    post:
      tags:
        - COMMUNITY_INVITE_LINK
      summary: Regenerate invite link
      description: >
        Atomically revokes the existing active invite link and creates a new one.
        The old link immediately stops accepting submissions.
      operationId: regenerateCommunityInviteLink
      parameters:
        - name: communityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Invite link regenerated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteLinkResponse"
        "403":
          description: Insufficient privileges
        "404":
          description: Community not found
        "409":
          description: Active invite link already exists
        "422":
          description: Join requests are not enabled
  /api/community-management/communities/{communityId}/invite-link/revoke:
    post:
      tags:
        - COMMUNITY_INVITE_LINK
      summary: Revoke invite link
      description: >
        Revokes the active invite link. Revoked links can never be reactivated
        and never accept submissions again.
      operationId: revokeCommunityInviteLink
      parameters:
        - name: communityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Invite link revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteLinkResponse"
        "403":
          description: Insufficient privileges
        "404":
          description: Community not found
        "409":
          description: Active invite link already exists
  /api/community-management/communities/partners:
    get:
      tags:
        - ECMS_COMMUNITY_PARTNER
      summary: Get partners in all communities
      description: Get list of partners with number of managed communities for each partner
      operationId: getCommunityPartners
      responses:
        "200":
          description: Partner retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PartnerResponse'
        "400":
          description: Invalid partner request
        "404":
          description: Community not found
  /api/community-management/communities/members:
    get:
      tags:
        - ECMS_COMMUNITY
      summary: Gets a paginated list of all members across all communities
      description: >
        Returns every member (participant) in every community with their
        metering point assignments and community identifier fields. The
        response is paginated on members.
      operationId: getCommunityMembersECMS
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            format: int32
            nullable: true
        - name: pageSize
          in: query
          schema:
            type: integer
            format: int32
            nullable: true
      responses:
        "200":
          description: Response with a paginated list of all community members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EcmsCommunityMembersSearchResponse'
        "403":
          description: Insufficient privileges
  /api/community-management/communities/{communityId}/partner:
    put:
      tags:
        - ECMS_COMMUNITY_PARTNER
      summary: Update community partner
      description: Set or update community partner
      operationId: updateCommunityPartner
      parameters:
        - name: communityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerRequest'
      responses:
        "200":
          description: Partner updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityResponse'
        "400":
          description: Invalid partner request
        "404":
          description: Community not found
  /api/community-management/web-app/communities/{communityId}/members:
    get:
      tags:
        - WEB_APP_ADMIN_COMMUNITY_MEMBER
      summary: Gets a sorted list of community members
      operationId: getCommunityMembersWA
      parameters:
        - name: communityId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Response with sorted list of community members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityMemberSearchResponse'
        "403":
          description: Insufficient privileges
  /api/community-management/web-app/communities/{communityId}/metering-point-assignments:
    get:
      tags:
        - WEB_APP_ADMIN_METERING_POINT_ASSIGNMENTS
      summary: Gets a list of metering point assignments in the community
      operationId: getCommunityMeteringPointAssignmentsWA
      parameters:
        - name: communityId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: getCommunityMeteringPointAssignmentsWA 200 response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommunityMeteringPointAssignmentSearchResult'
  /api/community-management/web-app/communities/{communityId}/participants/:
    post:
      tags:
        - WEB_APP_ADMIN_PARTICIPANT
      summary: Add participant
      operationId: createParticipantWA
      parameters:
        - name: communityId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaParticipantRequest'
        required: true
      responses:
        "200":
          description: Participant created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaParticipantResponse'
        "400":
          description: Request validation error
        "403":
          description: Insufficient privileges
  /api/community-management/web-app/communities/{communityId}/participants/{participantId}:
    get:
      tags:
        - WEB_APP_ADMIN_PARTICIPANT
      summary: Get participant by id
      operationId: getParticipantWA
      parameters:
        - name: communityId
          in: path
          required: true
          schema:
            type: string
        - name: participantId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Response with a participant data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaParticipantResponse'
        "403":
          description: Insufficient privileges
        "404":
          description: No participant found
    put:
      tags:
        - WEB_APP_ADMIN_PARTICIPANT
      summary: Update participant
      operationId: updateParticipantWA
      parameters:
        - name: communityId
          in: path
          required: true
          schema:
            type: string
        - name: participantId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaParticipantRequest'
        required: true
      responses:
        "200":
          description: Participant updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaParticipantResponse'
        "400":
          description: Request validation error
        "403":
          description: Insufficient privileges
        "404":
          description: Participant not found
    delete:
      tags:
        - WEB_APP_ADMIN_PARTICIPANT
      summary: Delete participant by id
      operationId: deleteParticipantWA
      parameters:
        - name: communityId
          in: path
          required: true
          schema:
            type: string
        - name: participantId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Participant deleted successfully
        "400":
          description: Request validation error
        "403":
          description: Insufficient privileges
        "404":
          description: Participant not found
  /api/community-management/web-app/communities/{communityId}/participants/{participantId}/addresses:
    get:
      tags:
        - WEB_APP_ADMIN_PARTICIPANT
      summary: Get all addresses of a participant
      operationId: getParticipantAddressesWA
      parameters:
        - name: communityId
          in: path
          required: true
          schema:
            type: string
        - name: participantId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: getParticipantAddressesWA 200 response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ParticipantAddressResponse'
    post:
      tags:
        - WEB_APP_ADMIN_PARTICIPANT
      summary: Add address to participant
      operationId: createParticipantAddressWA
      parameters:
        - name: communityId
          in: path
          required: true
          schema:
            type: string
        - name: participantId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipantAddressRequest'
        required: true
      responses:
        "200":
          description: Address added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantAddressResponse'
        "400":
          description: Request validation error
        "403":
          description: Insufficient privileges
        "404":
          description: Participant not found
  /api/community-management/web-app/communities/{communityId}/participants/{participantId}/addresses/{addressId}:
    get:
      tags:
        - WEB_APP_ADMIN_PARTICIPANT
      summary: Get a specific address of a participant
      operationId: getParticipantAddressWA
      parameters:
        - name: communityId
          in: path
          required: true
          schema:
            type: string
        - name: participantId
          in: path
          required: true
          schema:
            type: string
        - name: addressId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Participant address data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantAddressResponse'
        "403":
          description: Insufficient privileges
        "404":
          description: Participant or address not found
    put:
      tags:
        - WEB_APP_ADMIN_PARTICIPANT
      summary: Update participant address
      operationId: updateParticipantAddressWA
      parameters:
        - name: communityId
          in: path
          required: true
          schema:
            type: string
        - name: participantId
          in: path
          required: true
          schema:
            type: string
        - name: addressId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipantAddressRequest'
        required: true
      responses:
        "200":
          description: Address updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantAddressResponse'
        "400":
          description: Request validation error
        "403":
          description: Insufficient privileges
        "404":
          description: Participant or address not found
    delete:
      tags:
        - WEB_APP_ADMIN_PARTICIPANT
      summary: Delete participant address
      operationId: deleteParticipantAddressWA
      parameters:
        - name: communityId
          in: path
          required: true
          schema:
            type: string
        - name: participantId
          in: path
          required: true
          schema:
            type: string
        - name: addressId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Address deleted successfully
        "400":
          description: Request validation error
        "403":
          description: Insufficient privileges
        "404":
          description: Participant or address not found
  /api/community-management/web-app/communities/{communityId}/participants/{participantId}/metering-point-assignments:
    post:
      tags:
        - WEB_APP_ADMIN_PARTICIPANT
      summary: Add metering point assignment to participant
      operationId: createMeteringPointAssignmentWA
      parameters:
        - name: communityId
          in: path
          required: true
          schema:
            type: string
        - name: participantId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeteringPointAssignmentsRequest'
        required: true
      responses:
        "200":
          description: Metering point added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaMeteringPointAssignmentResponse'
        "400":
          description: Request validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/MeteringPointNumberUniqueProblem'
        "403":
          description: Insufficient privileges
        "404":
          description: Participant not found
  /api/community-management/web-app/communities/{communityId}/participants/{participantId}/metering-point-assignments/{meteringPointAssignmentId}:
    put:
      tags:
        - WEB_APP_ADMIN_PARTICIPANT
      summary: Update participant metering point assignment basic information
      operationId: updateMeteringPointAssignmentWA
      parameters:
        - name: communityId
          in: path
          required: true
          schema:
            type: string
        - name: participantId
          in: path
          required: true
          schema:
            type: string
        - name: meteringPointAssignmentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BasicMeteringPointAssignmentDataRequest'
        required: true
      responses:
        "200":
          description: Metering point assignment updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaMeteringPointAssignmentResponse'
        "400":
          description: Request validation error
        "403":
          description: Insufficient privileges
        "404":
          description: Participant or metering point assignment not found
    delete:
      tags:
        - WEB_APP_ADMIN_PARTICIPANT
      summary: Delete metering point assignment from participant
      operationId: deleteMeteringPointAssignmentWA
      parameters:
        - name: communityId
          in: path
          required: true
          schema:
            type: string
        - name: participantId
          in: path
          required: true
          schema:
