components:
  schemas:
    BasicMeteringPointAssignmentDataRequest:
      required:
        - gridOperatorId
        - meteringPointType
        - number
      type: object
      properties:
        number:
          type: string
        meteringPointType:
          $ref: '#/components/schemas/MeteringPointType'
        gridOperatorId:
          type: string
    CommunityAddressRequest:
      required:
        - city
        - postalCode
        - streetHouseNumber
      type: object
      properties:
        streetHouseNumber:
          minLength: 1
          type: string
        addressAdditions:
          required:
            - "false"
          type: string
          nullable: true
        postalCode:
          minLength: 1
          type: string
        city:
          minLength: 1
          type: string
    CommunityAddressResponse:
      required:
        - city
        - id
        - postalCode
        - streetHouseNumber
      type: object
      properties:
        id:
          type: string
        streetHouseNumber:
          type: string
        addressAdditions:
          type: string
        postalCode:
          type: string
        city:
          type: string
    CommunityMemberSearchResponse:
      required:
        - communityId
        - result
      type: object
      properties:
        communityId:
          type: string
        result:
          type: array
          items:
            $ref: '#/components/schemas/CommunityMemberSearchResult'
    CommunityMemberSearchResult:
      required:
        - consumptionMeteringPointAssignments
        - email
        - fullName
        - memberJoinDate
        - participantId
        - productionMeteringPointAssignments
        - accountId
      type: object
      properties:
        participantId:
          type: string
        fullName:
          type: string
        phoneNumber:
          type: string
          nullable: true
        email:
          type: string
        productionMeteringPointAssignments:
          type: integer
          format: int32
        consumptionMeteringPointAssignments:
          type: integer
          format: int32
        memberJoinDate:
          type: string
          format: date
        accountId:
          type: string
          format: uuid
          nullable: true
    CommunityMeteringPointAssignmentSearchResult:
      required:
        - createdAt
        - currentEnergyTariff
        - currentTaxRate
        - gridOperator
        - id
        - meteringPointType
        - number
        - participantId
        - orderId
      type: object
      properties:
        id:
          type: string
        number:
          type: string
        currentTaxRate:
          $ref: '#/components/schemas/TaxRate'
        contactName:
          type: string
          nullable: true
        contactEmail:
          type: string
          nullable: true
        address:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/MeteringPointAssignmentAddressReponse'
        currentEnergyTariff:
          type: number
        meteringPointType:
          $ref: '#/components/schemas/MeteringPointType'
        createdAt:
          type: string
          format: date-time
        paymentDetails:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/PaymentDetailsResponse'
        participantId:
          type: string
        gridOperator:
          $ref: '#/components/schemas/GridOperatorResponse'
        orderId:
          type: integer
        additionalInformation:
          type: string
          nullable: true
        membershipFee:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/MeteringPointMembershipFeeResponse'
    CommunityProfileResponse:
      required:
        - communityName
        - energyCommunityId
        - id
        - managerEmail
        - managerName
        - managerPhoneNumber
        - rcId
        - sharingConcept
        - type
        - managerAccountId
      type: object
      properties:
        id:
          type: string
        rcId:
          type: string
        energyCommunityId:
          type: string
        communityName:
          type: string
        type:
          $ref: '#/components/schemas/CommunityType'
        managerName:
          type: string
        managerEmail:
          type: string
        managerPhoneNumber:
          type: string
        sharingConcept:
          $ref: '#/components/schemas/SharingConcept'
        participantId:
          type: string
          nullable: true
        managerAccountId:
          type: string
          format: uuid
          nullable: true
    CommunityRequest:
      required:
        - communityAddress
        - communityName
        - energyCommunityId
        - legalEntityNumber
        - managerEmail
        - managerName
        - marketParticipationNumber
        - sharingConcept
        - status
        - taxable
      type: object
      properties:
        marketParticipationNumber:
          maxLength: 255
          type: string
        energyCommunityId:
          maxLength: 255
          type: string
        customerId:
          maxLength: 255
          type: string
