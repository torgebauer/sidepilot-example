  base_url: '${LLM_BASE_URL}'
  context_limit: 48000
  max_output_tokens: 16384
  api_tool_selection_limit: 10
  model_pricing:
    deepseek-v4-flash: { input_per_million: 0.19, output_per_million: 0.51 }
