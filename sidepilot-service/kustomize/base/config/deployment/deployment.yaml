app:
  id: pilot
  name: enox.share
  environment: development

runtime_mode: user

access_gate:
  type: email_allowlist
  claim: ${SIDEPILOT_JWT_CLAIM:-email}
  emails_env: SIDEPILOT_ALLOWED_EMAILS
  emails: []
  managed: true

token_verification:
  type: ${SIDEPILOT_JWT_VERIFY_TYPE:-none}
  issuer_env: SIDEPILOT_JWT_ISSUER
  audience_env: SIDEPILOT_JWT_AUDIENCE
  issuers:
    - issuer_env: SIDEPILOT_JWT_ISSUER
      audience_env: SIDEPILOT_JWT_AUDIENCE
    - issuer_env: SIDEPILOT_ENDUSER_JWT_ISSUER
      jwks_uri_env: SIDEPILOT_ENDUSER_JWT_JWKS_URI
      audience_env: SIDEPILOT_ENDUSER_JWT_AUDIENCE

database:
  url: '${SIDEPILOT_PILOT_DATABASE_URL:?Set SIDEPILOT_PILOT_DATABASE_URL in packages/server/.env.local}'

retrieval:
  chat_backend: knowledge-system
  knowledge_system:
    base_url: '${KNOWLEDGE_SYSTEM_API_URL:-http://127.0.0.1:3005}'
    workspace_id: pilot
  sources: []

api_access:
  enabled: true
  feature_map_path: ./feature-operation-map.yaml
  page_operation_map_path: ./page-operation-map.yaml
  specs:
    - id: community-management
      path: ./openapi/community-management-service.yml
      base_url: '${SIDEPILOT_PILOT_COMMUNITY_MANAGEMENT_API_URL:?Set SIDEPILOT_PILOT_COMMUNITY_MANAGEMENT_API_URL in packages/server/.env.local}'
      path_patterns:
        - /api/community-management/
        - /api/v2/community-management/
        - /api/invite/
      allowed_methods: [get, post, put, patch, delete]
      operations:
        - getAvailableGridOperators
        - getCommunity
        - getCommunityMembersWA
        - getCommunityMeteringPointAssignmentsWA
        - getCommunityPaymentOptions
        - getParticipantWA
        - getCommunityProfile
        - getParticipantProfile
        - getParticipantAddressesWA
        - getParticipantAddressWA
        - getParticipantPaymentOptions
        - createParticipantWA
        - updateParticipantWA
        - createParticipantAddressWA
        - updateParticipantAddressWA
        - createMeteringPointAssignmentWA
        - updateMeteringPointAssignmentWA
        - deleteMeteringPointAssignmentWA
        - updateMeteringPointAssignmentAddressWA
        - updateMeteringPointAssignmentEnergyTariffWA
        - updateMeteringPointAssignmentPaymentOptionWA
        - updateMeteringPointAssignmentTaxRateWA
        - updateMeteringPointAssignmentAdditionalInformationWA
        - updateMeteringPointAssignmentMembershipFeeWA
        - deleteMeteringPointAssignmentMembershipFeeWA
        - selectPaymentOptionForMeteringPoint
        - createPaymentOption
        - updatePaymentOption
        - getMeteringPointPaymentOptions
        - updateCommunityBaseInformation
        - updateCommunityVisibilityInformation
        - getCommunityLogo
        - uploadCommunityLogo
        - deleteCommunityLogo
        - getCommunityInviteLink
        - generateCommunityInviteLink
        - regenerateCommunityInviteLink
        - revokeCommunityInviteLink
        - getCommunityPaymentDetails
        - updateCommunityPaymentDetails
        - deleteParticipantWA
        - deleteParticipantAddressWA
        - deletePaymentOption
        - updateMeteringPointAssignment
        - getCommunityReportECMS
    - id: onboarding
      path: ./openapi/onboarding-service.yml
      base_url: '${SIDEPILOT_PILOT_COMMUNITY_MANAGEMENT_API_URL:?Set SIDEPILOT_PILOT_COMMUNITY_MANAGEMENT_API_URL in packages/server/.env.local}'
      path_patterns:
        - /api/onboarding/
      allowed_methods: [get, post, put]
      operations:
        - listOnboardingRequests
        - countOpenOnboardingRequests
        - getOnboardingRequest
        - acceptOnboardingRequest
        - rejectOnboardingRequest
        - updateOnboardingRequest
    - id: meter-measurement
      path: ./openapi/metering-data-service.yml
      base_url: '${SIDEPILOT_PILOT_METER_MEASUREMENT_API_URL:?Set SIDEPILOT_PILOT_METER_MEASUREMENT_API_URL in packages/server/.env.local}'
      path_patterns:
        - /api/communities/.*/(dashboard|energy-graph|available-data|data-quality)
        - /api/communities/[^/]+/admin/metering-points
        - /api/communities/[^/]+/participants/[^/]+/metering-points
        - /api/communities/[^/]+/exports
      allowed_methods: [get, post]
      operations:
        - getCommunityDashboard
        - getCommunityAvailableDataRange
        - getEnergyGraphDataByCommunity
        - getReport
        - getParticipantConsumerDashboard
        - getParticipantProsumerDashboard
        - getParticipantConsumerEnergyGraphData
        - getParticipantProsumerEnergyGraphData
        - getAdminMeteringPoints
        - getAdminConsumerDashboard
        - getAdminConsumerEnergyGraphData
        - getAdminProsumerDashboard
        - getAdminProsumerEnergyGraphData
        - createExportJob
        - listExportJobs
        - downloadExport
        - getParticipantMeteringPoints
    - id: participant
      path: ./openapi/participant-service.yml
      base_url: '${SIDEPILOT_PILOT_PARTICIPANT_API_URL:?Set SIDEPILOT_PILOT_PARTICIPANT_API_URL in packages/server/.env.local}'
      path_patterns:
        - /api/participants/
        - /api/account/[^/]+/communities/[^/]+/roles
        - /api/communities/[^/]+/settings
      allowed_methods: [get, patch]
      operations:
        - getParticipantPermissions
        - getParticipantPermissionsByCommunity
        - getAccountRoles
        - getCommunitySettings
        - updateCommunitySettings
    - id: market-processes
      path: ./openapi/market-processes.yml
      base_url: '${SIDEPILOT_PILOT_MARKET_PROCESSES_API_URL:?Set SIDEPILOT_PILOT_MARKET_PROCESSES_API_URL in packages/server/.env.local}'
      path_patterns:
        - /api/communities/[^/]+/(metering-points|assigned-metering-points|unassigned-metering-points)
        - /api/communities/[^/]+/processes
        - /api/communities/[^/]+/energy(-request)?
      allowed_methods: [get, post]
      operations:
        - getMeteringPoints
        - getAssignedMeteringPoints
        - getUnassignedMeteringPoints
        - getParticipantMeteringPoints
        - RegisterMeteringPoints
        - changeParticipationFactorMeteringPoints
        - deactivateMeteringPoints
        - checkIfEligibleToRequestEnergyData
        - requestEnergyDataForEnergyCommunity
        - dismissMarketProcesses
        - getMarketProcess
        - updateShareFactorMeteringPoints
    - id: billing
      path: ./openapi/billing-api.yml
      base_url: '${SIDEPILOT_PILOT_BILLING_API_URL:?Set SIDEPILOT_PILOT_BILLING_API_URL}'
      allowed_methods: [get, post, patch]
      operations:
        - getBillingPeriods
        - getBillingPeriodById
        - createBillingPeriod
        - previewBillingPeriod
        - publishBillingPeriod
        - getPublishedBillingPeriods
        - getPublishedBillingPeriodById
        - getPublishedBillDetails
        - getPublishedBillDocument

policies:
  confirmations:
    timeout_ms: 300000
  role_mapping:
    admin:
      can: ["*"]
    support:
      can:
        - knowledge.read
        - customer.read
        - tariff.read
        - tariff.update

frontend:
  commands:
    allowed:
      - navigate
      - set_field
      - read_page_state
      - highlight_entity
      - refresh_resource
      - submit_form
      - show_notification

runtime_context:
  route_templates:
    - /de/:communityId/dashboard/community
    - /de/:communityId/members
    - /de/:communityId/members/:participantId
    - /de/:communityId/metering-points
    - /de/:communityId/new-invoices
    - /de/:communityId/onboarding/:requestId
  action_argument_guards:
    - action_id: updateEnergyTariff
      request_patterns:
        - "\\b(abnehmer|verbraucher|consumers?)\\b"
      source_paths:
        - community-metering-points
        - community-assigned-metering-points
      source_filters:
        - field: meteringPointType
          equals: CONSUMPTION
      target_param: meteringPointUpdates
      target_param_format: json_array
      entry_mapping:
        participantId: participantId
        meteringPointAssignmentId: id
      dedupe_field: meteringPointAssignmentId

pages:
  - route: /de/:communityId/dashboard/community
    name: Community Dashboard
    description: Overview dashboard showing community KPIs, available energy data range, and community energy graph values.
    entityType: community
    capabilities:
      - type: view
        description: View current community KPIs and energy graph values
      - type: action
        id: updateDateRange
        description: Change dashboard date range and refresh visible energy data

  - route: /de/:communityId/members
    name: Member List
    description: >-
      Shows all members/participants in the energy community, including names and available
      participant details. The list does not contain the Kundennummer (customerNumber) —
      it is only available on the member detail (participant record via getParticipantWA).
    entityType: participant
    capabilities:
      - type: view
        description: View list of members and participant data
      - type: select
        entityType: participant

  - route: /de/:communityId/members/:participantId
    name: Member Detail
    description: Shows participant details, metering points, and member-specific energy context.
    entityType: participant
    capabilities:
      - type: view
        description: View participant details and metering points
      - type: select
        entityType: meteringPoint
      - type: action
        id: viewEnergyData
        description: Use participant consumer/prosumer dashboard and graph endpoints for this participant

  - route: /de/:communityId/metering-points
    name: Metering Points
    description: >-
      Shows all community metering point assignments with status, process, type, participant,
      tariff, tax, payment option, and assignment IDs. Community-management assignment records
      carry no lifecycle status — status comes from the market-process reads; assignment IDs
      and delete eligibility come from community-management. The table has separate columns:
      "Status" = activationStatus (ACTIVE/Aktiv, SCHEDULED/Geplant, ARCHIVED/Archiviert,
      NOT_ACTIVE = "Neu" if never activated else "Inaktiv" per hasBeenActivated) and
      "Prozess" = processStatus (REQUESTED/Angefragt, ACCEPTED/Akzeptiert, REJECTED/Abgelehnt
      — rejected rows show a "Fehler beheben" link). "Aktiviert seit" = activationDate and is
      only shown while activationStatus is ACTIVE. The per-point Prozesshistorie comes from
      getAssignedMeteringPoints → processes[] (marketProcessType, startedOn = "Angefragt am",
      completedOn, status; newest first).
      IMPORTANT — to answer "what does the table show" (counts, "Neu"/"Inaktiv"/"Aktiv" rows,
      their numbers), read the visible-data key community-metering-points: each row already
      carries a derived "status" field holding the exact label the table's Status column shows
      (Neu, Inaktiv, Aktiv, Geplant, Archiviert, Angefragt, Akzeptiert, Abgelehnt). Filter on that
      field directly — e.g. status == "Neu" — and report those rows' "number". Do NOT recompute
      the status from activationStatus/hasBeenActivated, do NOT use getMeteringPoints /
      community-kep-metering-points on their own (that set includes points with no assignment,
      which are NOT in the table), and do NOT use community-assigned-metering-points for the
      Status column (it has no hasBeenActivated). Booleans are valid compute_stats where-values.
      For a bulk change across metering points (e.g. set all Abnehmer tariffs), first fetch the
      assignments via getCommunityMeteringPointAssignmentsWA — that API result is a record set
      bulk_call can operate on (it carries id, participantId and meteringPointType); the
      community-metering-points visible data from read_page_state cannot be used as a bulk_call
      record set.
      The table is URL-filterable via update_params: "metering-point=<AT-Nummer oder Suchtext>"
      filters the rows, "meteringPointTables=0|1" selects the Zugewiesen/Nicht-zugewiesen tab —
      use this when the user asks to filter the view (e.g. after naming the "Neu" points).
    entityType: meteringPoint
    capabilities:
      - type: view
        description: View all metering point assignments
      - type: select
        entityType: meteringPoint
      - type: action
        id: deleteInactiveAssignments
        description: Delete eligible NOT_ACTIVE metering point assignments using community-management assignment IDs
      - type: action
        id: updateEnergyTariff
        description: Update energy tariff for selected metering point assignments
      - type: action
        id: manageActivationStatus
        description: "Metering-point status (activationStatus: active/scheduled/new/inactive/archived), process status (processStatus: requested/accepted/rejected), activation date, and the per-point process history (processes[]) come from the market-process reads (getMeteringPoints, getAssignedMeteringPoints), not community-management. Register a new/pending point (RegisterMeteringPoints); deactivate or change the participation factor of active ones (deactivateMeteringPoints, changeParticipationFactorMeteringPoints). Market-process writes — read status first, then confirm."

  - route: /de/:communityId/dashboard/production
    name: Production Dashboard
    description: Production dashboard (Erzeugung) showing prosumer production statistics and the energy graph for a selectable date range.
    entityType: community
    capabilities:
      - type: view
        description: View production statistics and energy graph values

  - route: /de/:communityId/dashboard/consumption
    name: Consumption Dashboard
    description: Consumption dashboard (Verbrauch) showing consumer consumption and autarky statistics with the energy graph.
    entityType: community
    capabilities:
      - type: view
        description: View consumption statistics and energy graph values

  - route: /de/:communityId/members/add
    name: Add Member
    description: Form to create a new member/participant (Mitglied hinzufügen) in the energy community.
    entityType: participant
    capabilities:
      - type: view
        description: View the new-member creation form

  - route: /de/:communityId/members/:participantId/metering-points/add
    name: Assign Metering Point
    description: Assign or create a metering point for a member, including participant address, payment option, and grid operator selection.
    entityType: meteringPoint
    capabilities:
      - type: view
        description: View the metering point assignment form for a member

  - route: /de/:communityId/energy-data
    name: Energy Data
    description: Energy data page (Energiedaten) with the data-quality report, energy data export jobs, and requesting energy data for the community.
    entityType: community
    capabilities:
      - type: view
        description: View the data-quality report and export jobs

  - route: /de/:communityId/new-invoices
    name: Billing
    description: >-
      Current billing page (Abrechnung) with billing periods (Abrechnungsperioden).
      The assistant can read billing periods and published bills AND run the billing
      lifecycle itself (each write confirmation-gated): calculate a preview
      (previewBillingPeriod, required query startDate + endDate), create and calculate
      a period (createBillingPeriod, body startingDate + endDate, query notifyAdmins),
      and publish it (publishBillingPeriod, query notifyMember). Status flow:
      OPEN → PREVIEW → IN_GENERATION → READY_TO_PUBLISH → PUBLISHED (or
      DOCUMENT_GENERATION_FAILED). While a period is IN_GENERATION, poll
      getBillingPeriodById; after any billing write, refresh the page data via
      refresh_resource with resource "billing-periods". Deleting billing periods and
      generating DATEV/SEPA/spreadsheet/ZIP exports remain user-only on this page —
      the assistant cannot read binary documents, so bill contents are checked via the
      JSON reads (getBillingPeriodById, previewBillingPeriod, getPublishedBillDetails).
      The "Abrechnung nicht verfügbar" empty state is normal (no complete billing
      period yet); the first period can be created right here.
    entityType: billingPeriod
    capabilities:
      - type: view
        description: View billing periods and published bills; guide the user through the screen
      - type: action
        id: previewBillingPeriod
        description: Calculate a billing preview for a date range (previewBillingPeriod) without persisting anything
      - type: action
        id: createBillingPeriod
        description: Create and calculate a new billing period (createBillingPeriod) — confirm the date range with the user first
      - type: action
        id: publishBillingPeriod
        description: Publish a READY_TO_PUBLISH billing period (publishBillingPeriod) — always confirm, publishing notifies members when notifyMember is set
      - type: action
        id: switchBillingTab
        description: >-
          Switch the billing tab yourself with update_page_params on the `invoices` URL
          parameter — 0 Zusammenfassung, 1 Abnehmer, 2 Einspeiser, 3 Weitere Beiträge
          (tab 3 exists only when membership-fee data is present). Never tell the user
          you cannot switch tabs on this page. The tabs exist only once a billing period
          has data; on the "Abrechnung nicht verfügbar" empty state there is nothing to
          switch to.

  - route: /de/:communityId/invoices
    name: Legacy Billing
    description: >-
      Legacy billing page (Abrechnung bis 2025) showing old billing cycles with
      publishing and document downloads from the legacy system. View/explain only
      for the assistant — no legacy billing API access.
    entityType: billingPeriod
    capabilities:
      - type: view
        description: Read the visible legacy billing cycles and guide the user through the screen

  - route: /de/:communityId/my-invoices
    name: My Invoices
    description: >-
      Personal invoices page (Meine Rechnungen) listing the member's own bills and
      credit notes with PDF/ZIP downloads.
    entityType: invoice
    capabilities:
      - type: view
        description: View own bills and credit notes

  - route: /de/:communityId/my-invoices/:invoiceId
    name: My Invoice Detail
    description: >-
      Single personal invoice with bill details, payment information, QR code, and
      PDF download.
    entityType: invoice
    capabilities:
      - type: view
        description: View the bill details

  - route: /de/:communityId/community-information
    name: Community Settings
    description: Community management page (Gemeinschaft verwalten) for editing base information, visibility, payment details, logo, and invite links.
    entityType: community
    capabilities:
      - type: view
        description: View and edit community settings

  - route: /de/:communityId/onboarding
    name: Onboarding
    description: >-
      Onboarding page (Beitrittsanfragen) listing open join requests with the open-requests
      count. The assistant reviews and processes requests one at a time via the request
      detail page; the Excel bulk member import on this page is user-only — for bulk
      imports, explain the upload steps instead of performing them.
    entityType: participant
    capabilities:
      - type: view
        description: View open join requests and the open-requests count
      - type: select
        entityType: participant
      - type: action
        id: reviewOnboardingRequest
        description: Accept or reject an individual join request (with confirmation), one request at a time

  - route: /de/:communityId/onboarding/:requestId
    name: Onboarding Request Detail
    description: >-
      Detail view of a single join request (Beitrittsanfrage) with the submitted member
      data. Supports editing/saving the submission (updateOnboardingRequest) and accepting
      or rejecting it individually.
    entityType: participant
    capabilities:
      - type: view
        description: View the submitted join-request data
      - type: edit
        fields: []
        description: Correct and save the submitted data before accepting
      - type: action
        id: acceptOrRejectRequest
        description: Accept or reject this join request (with confirmation)

  - route: /de/:communityId/profile
    name: Profile
    description: Own profile page (Profil) with personal data, addresses, payment options, and own metering points; changes are permission-gated.
    entityType: participant
    capabilities:
      - type: view
        description: View own profile, addresses, and metering points

  - route: /de/:communityId/dashboard
    name: Dashboard
    description: >-
      Dashboard root that opens the community overview and switches between the three
      sub-dashboards (Community, Erzeugung/production, Verbrauch/consumption). The
      assistant has no API operations mapped to this route itself: it can navigate here,
      read the visible page state, and explain the dashboards from knowledge; data
      questions belong on the specific sub-dashboards.
    entityType: community
    capabilities:
      - type: view
        description: Read the visible overview and guide the user to the right sub-dashboard

api_response_fields:
  api_participant_getAccountRoles:
    drop:
      - communityId

api_request_fields:
  api_community-management_updateParticipantWA:
    required:
      - email

