apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sidepilot-server
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`sidepilot.shared.salzburg-ag.tech`) && PathPrefix(`/`)
      priority: 1000
      services:
        - kind: Service
          name: sidepilot-server
          port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: knowledge-system
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`knowledge-system.shared.salzburg-ag.tech`) && PathPrefix(`/`)
      priority: 1000
      services:
        - kind: Service
          name: knowledge-system
          port: 3005
