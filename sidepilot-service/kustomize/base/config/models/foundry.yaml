          context_limit: 48000
          max_output_tokens: 8192
          supports_tools: false
          supports_streaming: true
          request_timeout_ms: 8000
        - provider_ref: foundry
          model: gpt-5.4-mini
          context_limit: 48000
          max_output_tokens: 8192
          supports_tools: false
          supports_streaming: true
      streaming: true
      buffer_before_accept: false
