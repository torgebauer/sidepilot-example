apiVersion: v1
kind: Service
metadata:
  name: sidepilot-server
  labels:
    app.kubernetes.io/name: sidepilot-server
    app.kubernetes.io/part-of: sidepilot
spec:
  selector:
    app.kubernetes.io/name: sidepilot-server
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: knowledge-system
  labels:
    app.kubernetes.io/name: knowledge-system
    app.kubernetes.io/part-of: sidepilot
spec:
  selector:
    app.kubernetes.io/name: knowledge-system
  ports:
    - name: http
      protocol: TCP
      port: 3005
      targetPort: http
